name: Maintained build
on:
  push:
    branches: [maintained]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Configure CI browser
        shell: bash
        run: |
          mkdir -p .debug
          task_browser_path="$(node -p "require('playwright').chromium.executablePath()")"
          printf '#!/bin/bash\nexec %q --no-sandbox "$@"\n' "$task_browser_path" > .debug/ci-chrome
          chmod +x .debug/ci-chrome
          printf 'CHROME_PATH=%s/.debug/ci-chrome\n' "$PWD" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run features:check
      - run: npm run docs:check
      - run: npm run changelog:check
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - run: mkdir -p .debug/pack && npm pack --pack-destination .debug/pack
      - uses: actions/upload-artifact@v6
        with:
          name: maintained-package
          path: .debug/pack/*.tgz
